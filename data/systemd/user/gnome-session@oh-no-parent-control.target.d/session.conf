[Unit]
Requires=org.gnome.Kiosk.target
Requires=oh-no-parent-control-app.service
Wants=oh-no-parent-control-notifications.service
Wants=oh-no-parent-control-polkit-agent.service
After=oh-no-parent-control-polkit-agent.service
# Kiosk=true suppresses XDG autostart, but Ubuntu also starts Apport through
# graphical-session.target. Keep its directory watcher and UI out of this session.
Conflicts=update-notifier-crash.path update-notifier-crash.service
After=update-notifier-crash.path update-notifier-crash.service
