[Unit]
# Stop rapid failure loops; slow failures can outlast this rate-limit window.
# This budget includes all starts, including the initial start.
StartLimitIntervalSec=300s
StartLimitBurst=5

[Service]
# Trust database failures can exit normally with status 1, which the upstream
# on-abnormal policy does not restart. Keep recovery owned by systemd.
Restart=on-failure
RestartSec=5s
