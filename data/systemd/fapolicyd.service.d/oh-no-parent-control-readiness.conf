[Service]
# Type=forking reports ready before fapolicyd finishes loading its trust DB and
# installs its fanotify marks. Keep the unit activating until a real execution
# decision proves that kernel enforcement is live.
ExecStartPost=/usr/libexec/oh-no-parent-control-execution-policy-ready
# A configured upgrade may defer its backend activation until this startup.
# Do not admit graphical logins before the shipped child records are trusted.
ExecStartPost=/usr/libexec/oh-no-parent-control-package-activation wait-child-trust
TimeoutStartSec=180
