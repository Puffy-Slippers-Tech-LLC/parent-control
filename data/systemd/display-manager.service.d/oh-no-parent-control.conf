[Unit]
# Managed graphical sessions must not exist during fapolicyd's boot-time
# initialization window. A failed readiness probe therefore fails closed at
# the login-manager boundary.
Requires=fapolicyd.service
After=fapolicyd.service oh-no-parent-control-kiosk-confinement.service
Wants=oh-no-parent-control-kiosk-confinement.service
